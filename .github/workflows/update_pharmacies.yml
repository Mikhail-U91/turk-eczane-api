name: Daily Pharmacy Update

on:
  schedule:
    # Запуск каждый день в 04:00 по времени Стамбула
    - cron: '0 4 * * *'
      timezone: "Europe/Istanbul"
  workflow_dispatch: # Позволяет запускать скрипт кнопкой вручную

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v3

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # ВОТ ЗДЕСЬ БЫЛА ОШИБКА! Мы передаем ECZANEAPI_KEY, а не COLLECTAPI_KEY
      - name: Запрашиваем данные у EczaneAPI
        env:
          ECZANEAPI_KEY: ${{ secrets.ECZANEAPI_KEY }}
        run: node fetch_pharmacies.js

      - name: Публикуем результат в ветку gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
