name: Daily Pharmacy Update

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 по Стамбулу
      timezone: "Europe/Istanbul"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v3

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Запрашиваем данные у EczaneAPI
        env:
          TEKNIKZEKA_API_KEY: ${{ secrets.TEKNIKZEKA_API_KEY }}  # Взяли ключ из GitHub Secrets
        run: node fetch_pharmacies.js

      - name: Публикуем результат в ветку gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
