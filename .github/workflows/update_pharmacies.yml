name: Daily Pharmacy Update

on:
  schedule:
    # Запуск в 08:10 по Стамбулу (сразу после окончания ночной смены)
    - cron: '10 8 * * *'
      timezone: "Europe/Istanbul"
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачиваем репозиторий
        uses: actions/checkout@v3

      - name: Устанавливаем Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Запрашиваем данные у TeknikZeka
        env:
          TEKNIKZEKA_API_KEY: ${{ secrets.TEKNIKZEKA_API_KEY }}
        run: node fetch_pharmacies.js

      - name: Публикуем результат в ветку gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
